<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HenzPNX AI Assistant</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --chat-bg: #151f32;
            --accent-color: #00ffcc; 
            --accent-hover: #00ccaa;
            --text-color: #f1f5f9;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .chat-container {
            width: 500px;
            height: 700px;
            background: var(--chat-bg);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 255, 204, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #223554;
        }

        .chat-header {
            background: #0f172a;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid #223554;
        }

        .avatar {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, var(--accent-color), #3b82f6);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
        }

        .chat-header h1 {
            font-size: 20px;
            margin: 0;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .chat-box::-webkit-scrollbar {
            width: 6px;
        }
        .chat-box::-webkit-scrollbar-thumb {
            background-color: #223554;
            border-radius: 10px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.5;
            word-break: break-word;
            font-size: 15px;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            background: #2563eb;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.ai {
            background: #1e293b;
            color: #e2e8f0;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid #334155;
        }

        .input-area {
            padding: 20px;
            background: #0f172a;
            display: flex;
            gap: 12px;
            border-top: 1px solid #223554;
        }

        input {
            flex: 1;
            background: #1e293b;
            border: 1px solid #334155;
            padding: 14px;
            border-radius: 10px;
            color: white;
            outline: none;
            font-size: 15px;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent-color);
        }

        button {
            background: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 0 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            transition: all 0.2s;
        }

        button:hover {
            background: var(--accent-hover);
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <header class="chat-header">
            <div class="avatar">🤖</div>
            <div>
                <h1>HenzPNX AI</h1>
                <small style="color: #64748b;">Локальный клиент ПК (Версия 2.0)</small>
            </div>
        </header>
        
        <div class="chat-box" id="chatBox">
            <div class="message ai">Привет! Я твой полноценный ИИ-помощник HenzPNX. Напиши любой запрос в поле снизу, и я отвечу прямо здесь!</div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Введите ваш промпт здесь..." autocomplete="off">
            <button id="sendBtn">Запуск</button>
        </div>
    </div>

    <script>
        // Твой рабочий API-ключ DeepSeek
        const DEEPSEEK_API_KEY = "sk-12452971dc0549e59e04a323fd970514"; 

        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender);
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            userInput.value = '';

            const loadingDiv = document.createElement('div');
            loadingDiv.classList.add('message', 'ai');
            loadingDiv.innerText = 'HenzPNX генерирует ответ...';
            chatBox.appendChild(loadingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // Используем продвинутый обходной шлюз через текстовый провайдер Яндекса/Google-скриптов
                // Он принимает запросы в чистом текстовом виде и перенаправляет их в DeepSeek, полностью убирая ошибку CORS
                const targetUrl = 'https://deepseek.com';
                const gateUrl = 'https://codetabs.com' + encodeURIComponent(targetUrl);

                const response = await fetch(gateUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${DEEPSEEK_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: 'deepseek-chat',
                        messages: [
                            { role: 'system', content: 'Ты — HenzPNX, продвинутый, стильный и лаконичный ИИ-помощник.' },
                            { role: 'user', content: text }
                        ],
                        stream: false
                    })
                });
                
                const data = await response.json();
                chatBox.removeChild(loadingDiv);
                
                if (data.choices && data.choices[0] && data.choices[0].message) {
                    appendMessage(data.choices[0].message.content, 'ai');
                } else if (data.error) {
                    appendMessage(`Ошибка от DeepSeek: ${data.error.message}`, 'ai');
                } else {
                    appendMessage('Сервер прислал пустой ответ или баланс на ключе равен нулю.', 'ai');
                }
            } catch (error) {
                if (chatBox.contains(loadingDiv)) chatBox.removeChild(loadingDiv);
                appendMessage('Ошибка шлюза. Попробуй отправить сообщение еще раз.', 'ai');
                console.error(error);
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
